<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Contact AUCSS | Ashoka University Computer Science Society</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Geist:wght@400;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-container": "#646464",
                        "primary": "#b90015",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-secondary": "#ffffff",
                        "on-primary": "#ffffff",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f2f4f6",
                        "surface": "#f7f9fb",
                        "surface-tint": "#c00017",
                        "on-background": "#191c1e",
                        "outline-variant": "#e7bdb8",
                        "on-tertiary-fixed-variant": "#38485d",
                        "on-tertiary-container": "#fcfbff",
                        "secondary-container": "#e2e2e2",
                        "on-error-container": "#93000a",
                        "error-container": "#ffdad6",
                        "tertiary": "#4d5c72",
                        "outline": "#926f6b",
                        "background": "#f7f9fb",
                        "surface-dim": "#d8dadc",
                        "on-secondary-fixed": "#1b1b1b",
                        "tertiary-container": "#65758c",
                        "on-error": "#ffffff",
                        "primary-fixed": "#ffdad6",
                        "secondary": "#5e5e5e",
                        "on-secondary-fixed-variant": "#474747",
                        "tertiary-fixed": "#d3e4fe",
                        "surface-container-high": "#e6e8ea",
                        "inverse-primary": "#ffb4ac",
                        "on-primary-fixed": "#410003",
                        "inverse-on-surface": "#eff1f3",
                        "secondary-fixed-dim": "#c6c6c6",
                        "surface-container-highest": "#e0e3e5",
                        "on-surface-variant": "#5d3f3c",
                        "inverse-surface": "#2d3133",
                        "primary-fixed-dim": "#ffb4ac",
                        "surface-container-lowest": "#ffffff",
                        "primary-container": "#e21e26",
                        "surface-variant": "#e0e3e5",
                        "secondary-fixed": "#e2e2e2",
                        "surface-bright": "#f7f9fb",
                        "on-tertiary": "#ffffff",
                        "surface-container": "#eceef0",
                        "on-surface": "#191c1e",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "on-primary-fixed-variant": "#93000f",
                        "on-primary-container": "#fff9f8"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "1.5rem",
                        "full": "9999px"
                    },
                    fontFamily: {
                        "headline": ["Geist", "sans-serif"],
                        "display": ["Geist", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                        "label": ["JetBrains Mono", "monospace"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Geist', sans-serif; }
        .mono-label { font-family: 'JetBrains Mono', monospace; }
        
        .modal-blur {
            backdrop-filter: blur(8px);
            background: rgba(247, 249, 251, 0.8);
        }

        .custom-shadow {
            box-shadow: 0 32px 64px -12px rgba(0, 0, 0, 0.04);
        }

        /* Input specific focus states */
        .input-focus-ring:focus {
            border-color: #191c1e;
            box-shadow: inset 0 0 0 1px #b90015;
            outline: none;
        }

        .fade-in {
            animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
    </style>
</head>
<body class="bg-surface text-on-surface flex items-center justify-center min-h-screen p-3 sm:p-6">
<!-- Contact Modal Container -->
<div class="relative w-full max-w-2xl bg-surface-container-lowest rounded-2xl border border-outline-variant/30 custom-shadow fade-in overflow-hidden max-h-[95vh] flex flex-col">
<!-- Top Navigation / Header -->
<div class="flex items-center justify-between px-5 sm:px-8 py-5 sm:py-6 border-b border-outline-variant/20">
<div class="flex flex-col gap-1">
<span class="mono-label text-[10px] uppercase tracking-widest text-on-surface-variant font-medium">Contact Module / v1.0</span>
<h2 class="text-2xl font-black text-on-surface tracking-tighter uppercase">Get in Touch</h2>
</div>
<button aria-label="Close dialogue" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container transition-all active:scale-95 text-secondary shrink-0">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="p-5 sm:p-8 md:p-12 space-y-10 overflow-y-auto">
<!-- Form Section -->
<form class="space-y-6">
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Name Field -->
<div class="space-y-2">
<label class="mono-label text-xs font-medium text-on-surface-variant uppercase tracking-wider" for="name">01. Name</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body text-body-md input-focus-ring transition-all placeholder:text-on-secondary-container/50" id="name" placeholder="Alan Turing" type="text"/>
</div>
<!-- Email Field -->
<div class="space-y-2">
<label class="mono-label text-xs font-medium text-on-surface-variant uppercase tracking-wider" for="email">02. Email ID</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body text-body-md input-focus-ring transition-all placeholder:text-on-secondary-container/50" id="email" placeholder="alan.turing@ashoka.edu.in" type="email"/>
</div>
</div>
<!-- Message Field -->
<div class="space-y-2">
<label class="mono-label text-xs font-medium text-on-surface-variant uppercase tracking-wider" for="message">03. Message</label>
<textarea class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg font-body text-body-md input-focus-ring transition-all resize-none placeholder:text-on-secondary-container/50" id="message" placeholder="Briefly describe your query or project proposal..." rows="4"></textarea>
</div>
<!-- Action Bar -->
<div class="flex flex-col md:flex-row md:items-center justify-between pt-4 gap-6">
<div class="flex items-center gap-3">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse"></div>
<p class="font-body text-sm text-on-surface-variant">Estimated response: <span class="font-semibold text-on-surface">24-48 hours</span></p>
</div>
<button class="group w-full sm:w-auto flex items-center justify-center gap-2 px-8 py-3 bg-on-surface text-on-primary font-label text-sm uppercase tracking-widest rounded-lg hover:bg-primary transition-all duration-300 active:scale-95 shadow-lg shadow-on-surface/5" type="submit">
                        Send Message
                        <span class="material-symbols-outlined text-[18px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</div>
</form>
<!-- Metadata / Alternative Contact -->
<div class="pt-10 border-t border-outline-variant/20">
<div class="flex flex-col md:flex-row md:items-start gap-8 md:gap-16">
<div class="space-y-2 max-w-sm">
<span class="mono-label text-[10px] uppercase text-primary font-bold">Direct Channels</span>
<p class="font-body text-sm text-on-surface-variant leading-relaxed">
                            For immediate technical inquiries or academic collaboration, you can reach out via our official university handles.
                        </p>
</div>
<div class="space-y-4">
<div class="flex items-center gap-4 group cursor-pointer">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors text-[20px]">mail</span>
</div>
<div class="flex flex-col">
<span class="mono-label text-[10px] uppercase text-on-secondary-container">Email</span>
<a class="font-body text-sm font-semibold text-on-surface hover:text-primary transition-colors" href="mailto:cs.society@ashoka.edu.in">cs.society@ashoka.edu.in</a>
</div>
</div>
<div class="flex items-center gap-4 group cursor-pointer">
<div class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-primary transition-colors text-[20px]">alternate_email</span>
</div>
<div class="flex flex-col">
<span class="mono-label text-[10px] uppercase text-on-secondary-container">Social</span>
<a class="font-body text-sm font-semibold text-on-surface hover:text-primary transition-colors" href="https://instagram.com/cs.ashoka" target="_blank">@cs.ashoka <span class="text-on-secondary-container/50 font-normal ml-1">on Instagram</span></a>
</div>
</div>
</div>
</div>
</div>
</div>
<!-- Progress/Status Decor -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-surface-container">
<div class="h-full bg-primary w-1/3 opacity-20"></div>
</div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const submitBtn = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', (e) => {
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const email = document.getElementById('email').value.trim();
                const message = document.getElementById('message').value.trim();
                const recipient = 'cs.society@ashoka.edu.in';
                const subject = encodeURIComponent(`Contact form message from ${name || 'a visitor'}`);
                const body = encodeURIComponent(
                    `Name: ${name || 'Not provided'}\nEmail: ${email || 'Not provided'}\n\nMessage:\n${message || 'No message provided'}`
                );

                window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
                form.reset();
            });

            // Close button interaction
            document.querySelector('button[aria-label="Close dialogue"]').addEventListener('click', () => {
                const container = document.querySelector('.fade-in');
                container.style.transition = 'all 0.3s cubic-bezier(0.16, 1, 0.3, 1)';
                container.style.opacity = '0';
                container.style.transform = 'scale(0.95) translateY(20px)';
                setTimeout(() => {
                    alert('Dialogue would be dismissed in a real application.');
                    container.style.opacity = '1';
                    container.style.transform = 'scale(1) translateY(0)';
                }, 500);
            });
        });
    </script>
</body></html>
